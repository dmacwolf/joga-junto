plugins {
    id 'com.android.application'
}

// O número da execução no GitHub vira o versionCode: cada APK novo pode atualizar o anterior.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
// Endereço do site publicado. O workflow passa este valor com -PappUrl.
def appUrl = (project.findProperty('appUrl') ?: 'https://example.com/') as String

android {
    namespace 'app.jogajunto'
    compileSdk 34

    defaultConfig {
        applicationId 'app.jogajunto'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('../keystore/jogajunto.jks')
            // A chave e a senha ficam nos segredos do GitHub, fora do repositório.
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'jogajunto'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
