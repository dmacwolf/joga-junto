name: Gerar o APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Recuperar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/jogajunto.jks

      - name: Compilar o APK
        working-directory: android
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PappUrl="$APP_URL" --no-daemon --stacktrace

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jogajunto.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest jogajunto.apk \
            --title "Joga Junto (APK)" \
            --notes "Baixe o jogajunto.apk e instale. O app abre o site publicado, então se atualiza sozinho. Este arquivo só muda quando o invólucro Android muda."
